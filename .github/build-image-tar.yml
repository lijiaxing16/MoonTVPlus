# 把本文件放到你 fork 的 MoonTVPlus 仓库的 .github/workflows/ 下
# Actions -> Build image tar -> Run workflow，完成后在页面底部 Artifacts 下载
name: Build image tar

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: 'Dockerfile（完整版 Dockerfile / 精简版 Dockerfile.lite）'
        default: 'Dockerfile'
        type: choice
        options: [Dockerfile, Dockerfile.lite]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm   # 原生 ARM 构建，不走 QEMU，快很多
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          tags: moontvplus:latest
          outputs: type=docker,dest=/tmp/moontvplus-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Compress
        run: gzip -9 /tmp/moontvplus-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: moontvplus-${{ matrix.arch }}
          path: /tmp/moontvplus-${{ matrix.arch }}.tar.gz
          retention-days: 30
          compression-level: 0
